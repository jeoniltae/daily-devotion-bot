# 예약 워크플로가 자동 비활성화되지 않도록 주기적으로 다시 활성화한다.
#
# GitHub 은 공개 저장소에 60일간 활동(커밋 등)이 없으면 schedule 워크플로를 끈다.
# 발송은 구글 시트만 갱신하고 저장소에는 커밋하지 않으므로, 매일 돌아도 "활동"으로 치지 않는다.
# 빈 커밋 대신 enable API 를 호출해 타이머를 되돌린다. (CLAUDE.md 6장)

name: 워크플로 유지

on:
  schedule:
    # 매월 1일·15일 03:00 UTC. 60일보다 충분히 짧게 두어 한두 번 누락돼도 버틴다.
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

# 발송 워크플로와 권한을 분리한다. 여기에는 Secrets 가 없고 actions 쓰기만 필요하다.
permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: 워크플로 재활성화
        env:
          GH_TOKEN: ${{ github.token }}
        # 이 워크플로 자신도 schedule 이므로 함께 살려둔다.
        run: |
          for wf in daily.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done
